<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Spider Simulator predator loop visual</title>
  <desc id="desc">A stylized Spider Simulator close-up with a giant spider and cocoon-themed graphics.</desc>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f15"/>
      <stop offset="55%" stop-color="#1a1622"/>
      <stop offset="100%" stop-color="#27150f"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#76d6ff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#76d6ff" stop-opacity="0"/>
    </radialGradient>
    <filter id="eyeGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
