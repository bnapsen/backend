<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Spider Simulator traversal visual</title>
  <desc id="desc">A stylized Spider Simulator panel showing a spider swinging across a city skyline.</desc>
  <defs>
    <linearGradient id="sky" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1733"/>
      <stop offset="50%" stop-color="#16345b"/>
      <stop offset="100%" stop-color="#27170f"/>
    </linearGradient>
    <linearGradient id="webGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8fe7ff"/>
      <stop offset="100%" stop-color="#dffbff"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="url(#sky)"/>
  <circle cx="1350" cy="130" r="140" fill="#ffb15c" opacity="0.22"/>
  <circle cx="300" cy="160" r="170" fill="#48a9ff" opacity="0.18"/>
  <g fill="#10192a">
    <rect x="84" y="396" width="150" height="362" rx="10"/>
    <rect x="274" y="312" width="210" height="448" rx="12"/>
    <rect x="552" y="420" width="132" height="340" rx="10"/>
    <rect x="726" y="280" width="212" height="480" rx="14"/>
    <rect x="1008" y="344" width="154" height="416" rx="12"/>
    <rect x="1218" y="244" width="232" height="516" rx="14"/>
  </g>
  <g fill="#90d9ff" opacity="0.75">
    <rect x="328" y="360" width="18" height="214" rx="9"/>
    <rect x="812" y="330" width="20" height="252" rx="10"/>
    <rect x="1308" y="304" width="22" height="268" rx="11"/>
  </g>
  <path d="M154 760L316 704L462 724L638 668L830 716L1030 650L1234 710L1458 642L1600 678V900H0V812Z" fill="#0b1019"/>
  <g stroke="#8fe7ff" stroke-width="7" fill="none" filter="url(#glow)">
    <path d="M1188 134L988 268L790 406"/>
    <path d="M1002 250L962 210"/>
    <path d="M944 290L904 246"/>
  </g>
  <g fill="#04070c" filter="url(#glow)">
    <ellipse cx="742" cy="430" rx="50" ry="32"/>
    <circle cx="710" cy="420" r="12"/>
    <circle cx="776" cy="420" r="12"/>
    <path d="M690 446L632 412M694 456L622 454M702 468L642 514M792 446L850 412M788 456L860 454M780 468L840 514M718 394L680 342M766 394L804 342" stroke="#04070c" stroke-width="12" stroke-linecap="round"/>
  </g>
  <g fill="#f4fbff" font-family="Oxanium, Arial, sans-serif">
    <text x="88" y="92" font-size="34" font-weight="700" letter-spacing="5">TRAVERSAL //</text>
    <text x="88" y="158" font-size="88" font-weight="800">SWING. CLIMB. FLOAT.</text>
    <text x="92" y="214" font-size="28" font-weight="600" letter-spacing="3" opacity="0.85">RIGHT MOUSE FINDS ANCHORS OR TRANSITIONS INTO FLOATY FLIGHT</text>
  </g>
