<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Spider Simulator swarm visual</title>
  <desc id="desc">A stylized Spider Simulator panel showing city districts under swarm pressure.</desc>
  <defs>
