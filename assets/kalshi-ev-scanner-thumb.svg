<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Kalshi EV Scanner thumbnail</title>
  <desc id="desc">A dark dashboard thumbnail showing arbitrage consistency checks and green math alerts.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#06100e"/>
      <stop offset=".55" stop-color="#102322"/>
      <stop offset="1" stop-color="#1e2414"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" x2="1">
      <stop offset="0" stop-color="#30f29b"/>
      <stop offset="1" stop-color="#65d6ff"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="960" height="540" fill="url(#bg)"/>
  <g opacity=".16" stroke="#dcffef" stroke-width="2">
    <path d="M0 110H960M0 220H960M0 330H960M0 440H960"/>
    <path d="M120 0V540M240 0V540M360 0V540M480 0V540M600 0V540M720 0V540M840 0V540"/>
  </g>
  <rect x="76" y="76" width="808" height="388" rx="20" fill="#101817" stroke="#dcffef" stroke-opacity=".2"/>
  <text x="112" y="142" font-family="Oxanium, Arial, sans-serif" font-size="42" font-weight="800" fill="#f4fbf7">EV SCANNER</text>
  <text x="112" y="178" font-family="Arial, sans-serif" font-size="21" fill="#9ab0a7">Consistency math, fees, spreads</text>
  <g transform="translate(112 220)">
    <rect width="230" height="146" rx="12" fill="#151f1e" stroke="#30f29b" stroke-opacity=".35"/>
    <rect x="274" width="230" height="146" rx="12" fill="#151f1e" stroke="#65d6ff" stroke-opacity=".32"/>
    <rect x="548" width="230" height="146" rx="12" fill="#151f1e" stroke="#ffc75a" stroke-opacity=".32"/>
    <text x="24" y="42" font-family="Arial, sans-serif" font-size="19" fill="#9ab0a7">YES + NO</text>
    <text x="24" y="90" font-family="Oxanium, Arial, sans-serif" font-size="42" font-weight="800" fill="#30f29b">$0.98</text>
    <text x="298" y="42" font-family="Arial, sans-serif" font-size="19" fill="#9ab0a7">PAYOUT</text>
    <text x="298" y="90" font-family="Oxanium, Arial, sans-serif" font-size="42" font-weight="800" fill="#65d6ff">$1.00</text>
    <text x="572" y="42" font-family="Arial, sans-serif" font-size="19" fill="#9ab0a7">NET</text>
    <text x="572" y="90" font-family="Oxanium, Arial, sans-serif" font-size="42" font-weight="800" fill="#ffc75a">+2c</text>
  </g>
  <g filter="url(#glow)">
    <path d="M120 410 H820" stroke="url(#accent)" stroke-width="8" stroke-linecap="round"/>
    <circle cx="336" cy="410" r="15" fill="#30f29b"/>
    <circle cx="608" cy="410" r="15" fill="#65d6ff"/>
  </g>
</svg>
