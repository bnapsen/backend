<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">City Raid cover art</title>
  <desc id="desc">A stylized neon city skyline with radar beacons and a targeting ring.</desc>
  <defs>
    <linearGradient id="sky" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1630"/>
      <stop offset="55%" stop-color="#132b53"/>
      <stop offset="100%" stop-color="#081018"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#9fe4ff" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#3f78ff" stop-opacity="0.2"/>
    </linearGradient>
    <linearGradient id="street" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#12161e"/>
      <stop offset="100%" stop-color="#06080d"/>
    </linearGradient>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1600" height="1000" fill="url(#sky)"/>
  <circle cx="260" cy="160" r="220" fill="#2aa9ff" opacity="0.18"/>
  <circle cx="1270" cy="130" r="240" fill="#ffb14a" opacity="0.12"/>
  <circle cx="1010" cy="370" r="340" fill="#7cc9ff" opacity="0.08"/>

  <path d="M0 780L170 710L260 742L360 678L470 706L590 636L712 688L840 598L934 632L1058 565L1168 620L1298 545L1410 612L1600 540V1000H0Z" fill="#0d1420"/>
  <path d="M0 826L150 768L274 792L390 720L520 744L646 690L790 748L906 666L1028 700L1174 640L1298 694L1418 642L1600 712V1000H0Z" fill="#101928"/>
  <path d="M0 878L164 836L322 852L500 784L642 824L824 760L960 820L1122 768L1274 834L1440 780L1600 826V1000H0Z" fill="url(#street)"/>

  <g fill="#0f1d31">
    <rect x="140" y="282" width="112" height="430" rx="8"/>
    <rect x="274" y="214" width="158" height="500" rx="10"/>
    <rect x="466" y="318" width="106" height="396" rx="8"/>
    <rect x="612" y="250" width="162" height="462" rx="10"/>
    <rect x="808" y="184" width="142" height="530" rx="10"/>
    <rect x="986" y="310" width="116" height="404" rx="8"/>
    <rect x="1148" y="232" width="170" height="484" rx="10"/>
    <rect x="1368" y="342" width="104" height="372" rx="8"/>
  </g>

  <g fill="url(#glow)" opacity="0.95">
    <rect x="304" y="254" width="24" height="328" rx="12"/>
    <rect x="660" y="282" width="18" height="300" rx="9"/>
    <rect x="858" y="228" width="22" height="370" rx="11"/>
    <rect x="1210" y="264" width="24" height="334" rx="12"/>
  </g>

  <g filter="url(#softGlow)" stroke="#ffd463" stroke-width="18" fill="none" stroke-linejoin="round">
    <path d="M1228 248l56 56-56 56-56-56z"/>
    <path d="M1284 360l48 48"/>
    <path d="M1008 394l46 46-46 46-46-46z"/>
    <path d="M1054 486l40 40"/>
    <path d="M438 470l54 54-54 54-54-54z"/>
    <path d="M492 578l42 42"/>
  </g>

  <g fill="#f6fbff" font-family="Oxanium, Arial, sans-serif">
    <text x="112" y="126" font-size="44" font-weight="700" letter-spacing="6">WAVE 01</text>
    <text x="112" y="190" font-size="132" font-weight="800">CITY RAID</text>
    <text x="118" y="248" font-size="34" font-weight="600" letter-spacing="4" opacity="0.85">UNREAL ENGINE SURVIVAL PROTOTYPE</text>
  </g>

  <g stroke="#84d6ff" stroke-width="6" fill="none" opacity="0.72">
    <circle cx="1322" cy="170" r="88"/>
    <circle cx="1322" cy="170" r="142"/>
    <path d="M1322 44v54M1322 242v54M1196 170h54M1394 170h54"/>
  </g>
</svg>
