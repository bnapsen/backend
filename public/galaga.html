<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Galaga</title>
  <link rel="stylesheet" href="/galaga.css?v=20260503d">
</head>
<body class="galaga-focus">
  <main class="galaga-shell" aria-label="Galaga arcade game">
    <header class="galaga-hud">
      <a class="hud-back" href="/" aria-label="Back to all games">&larr;</a>
      <div class="hud-stat">
        <span>Wave</span>
        <strong id="wave-display">01</strong>
      </div>
      <div class="hud-stat">
        <span>Hits</span>
        <strong id="lives-display">0</strong>
      </div>
      <div class="hud-stat">
        <span>Score</span>
        <strong id="score-display">000000</strong>
      </div>
      <div class="hud-stat">
        <span>Best</span>
        <strong id="best-display">000000</strong>
      </div>
      <div class="hud-actions">
        <button class="hud-button primary" id="start-button" type="button">Start</button>
        <button class="hud-button" id="pause-button" type="button">Pause</button>
        <button class="hud-button" id="restart-button" type="button">Restart</button>
      </div>
    </header>

    <section class="playfield" aria-label="Game screen">
      <div class="screen-frame">
        <canvas id="game-canvas" width="480" height="640" aria-label="Galaga game screen"></canvas>
        <div class="screen-overlay" id="screen-overlay">
          <p class="overlay-kicker" id="overlay-kicker">Ready</p>
          <h2 id="overlay-title">Press Start</h2>
          <p id="overlay-copy">Clear formations forever. Ten kills can bank $1 in SIM; rare drops are worth $10.</p>
        </div>
      </div>
    </section>

    <section class="status-line" aria-live="polite">
      <h2 id="status-title">Formation steady</h2>
      <p id="status-copy">Take the center lane early. There is no final wave.</p>
    </section>

    <section class="mobile-controls" aria-label="Touch controls">
      <button class="control-button" data-control="left" type="button">Left</button>
      <button class="control-button control-button-fire" data-control="fire" type="button">Fire</button>
      <button class="control-button" data-control="right" type="button">Right</button>
    </section>
  </main>

  <script src="/galaga.js?v=20260512a" type="module"></script>
  <script src="../nova-auth.js?v=20260503c" defer></script>
</body>
</html>
