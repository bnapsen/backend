services:
  - type: web
    name: backend
    runtime: node
    branch: main
    autoDeployTrigger: commit
    rootDir: games/star-sprint
    buildFilter:
      paths:
        - games/star-sprint/**
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: DATA_DIR
        value: /var/data/nova-jukebox
    disk:
      name: nova-jukebox-data
      mountPath: /var/data
      sizeGB: 5
