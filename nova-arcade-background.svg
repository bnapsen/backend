    <linearGradient id="signHot" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#fff08c"/>
      <stop offset=".48" stop-color="#ff7b61"/>
      <stop offset="1" stop-color="#61ffe0"/>
