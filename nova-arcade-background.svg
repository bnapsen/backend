<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 2200" role="img" aria-labelledby="title desc">
  <title id="title">AP Advantage Player electric concourse background</title>
  <desc id="desc">A vivid arcade concourse with layered signs, light lanes, cabinet silhouettes, and a perspective floor.</desc>
  <defs>
    <linearGradient id="sky" x1="900" y1="0" x2="900" y2="2200" gradientUnits="userSpaceOnUse">
