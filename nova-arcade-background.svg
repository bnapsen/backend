<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 2000" role="img" aria-labelledby="title desc">
  <title id="title">Nova Arcade homepage background</title>
  <desc id="desc">A bright arcade skyline with glowing sun, grid, game portals, and sweeping neon paths.</desc>
  <defs>
    <linearGradient id="sky" x1="800" y1="0" x2="800" y2="2000" gradientUnits="userSpaceOnUse">
      <stop stop-color="#29538f"/>
      <stop offset=".28" stop-color="#243c76"/>
      <stop offset=".68" stop-color="#16264a"/>
      <stop offset="1" stop-color="#0d1630"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1120 248) rotate(90) scale(280 280)">
      <stop stop-color="#fff5bf"/>
      <stop offset=".44" stop-color="#ffca72"/>
      <stop offset="1" stop-color="#ff8e61" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cyanGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(350 290) rotate(90) scale(250 300)">
      <stop stop-color="#84f9ff" stop-opacity=".42"/>
      <stop offset="1" stop-color="#84f9ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="trackA" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#8bf8ff"/>
      <stop offset=".5" stop-color="#7ea2ff"/>
      <stop offset="1" stop-color="#ffc06f"/>
    </linearGradient>
    <linearGradient id="trackB" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#ffc772"/>
      <stop offset=".5" stop-color="#ff8e61"/>
      <stop offset="1" stop-color="#8bf8ff"/>
    </linearGradient>
    <linearGradient id="tower" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#27416c"/>
      <stop offset="1" stop-color="#111c36"/>
    </linearGradient>
    <linearGradient id="portal" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#84f9ff"/>
      <stop offset="1" stop-color="#ffca72"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="2000" fill="url(#sky)"/>
