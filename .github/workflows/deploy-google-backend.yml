name: Deploy Google Backend

on:
  push:
    branches:
      - main
    paths:
      - "Dockerfile"
      - "games/star-sprint/**"
      - ".github/workflows/deploy-google-backend.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: google-backend
  cancel-in-progress: true

env:
  GCP_PROJECT_ID: bnapsen
  GCP_REGION: us-central1
  CLOUD_RUN_SERVICE: nova-arcade-backend
  CLOUD_RUN_RUNTIME_SA: nova-arcade-runtime@bnapsen.iam.gserviceaccount.com
  WORKLOAD_IDENTITY_PROVIDER: projects/1000121513328/locations/global/workloadIdentityPools/github-actions/providers/github-provider
  GITHUB_DEPLOYER_SA: github-backend-deployer@bnapsen.iam.gserviceaccount.com

jobs:
  deploy-backend:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GITHUB_DEPLOYER_SA }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Authorize Docker for Artifact Registry
        shell: bash
        run: |
          gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

      - name: Build and push backend image
        shell: bash
        run: |
          IMAGE="us-central1-docker.pkg.dev/${GCP_PROJECT_ID}/cloud-run-source-deploy/${CLOUD_RUN_SERVICE}:github-${GITHUB_SHA}"
          docker build -t "${IMAGE}" .
          docker push "${IMAGE}"
          echo "IMAGE=${IMAGE}" >> "${GITHUB_ENV}"

      - name: Deploy backend to Cloud Run
        shell: bash
        run: |
          gcloud run deploy "${CLOUD_RUN_SERVICE}" \
            --project "${GCP_PROJECT_ID}" \
            --region "${GCP_REGION}" \
            --image "${IMAGE}" \
            --service-account "${CLOUD_RUN_RUNTIME_SA}" \
            --memory "1Gi" \
            --cpu "1" \
            --timeout "1800s" \
            --allow-unauthenticated \
            --quiet

      - name: Show live backend URL
        shell: bash
        run: |
          gcloud run services describe "${CLOUD_RUN_SERVICE}" \
            --project "${GCP_PROJECT_ID}" \
            --region "${GCP_REGION}" \
            --format='value(status.url)'
