<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">ScrapRunner Online cover</title>
  <desc id="desc">Top-down salvage runners collecting glowing scrap while drones close in near an extraction ring.</desc>
  <defs>
    <linearGradient id="bg" x1="120" y1="40" x2="1100" y2="640" gradientUnits="userSpaceOnUse">
      <stop stop-color="#10223a"/>
      <stop offset=".48" stop-color="#152019"/>
      <stop offset="1" stop-color="#1d120c"/>
    </linearGradient>
    <radialGradient id="cyan" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(910 132) rotate(90) scale(220 360)">
      <stop stop-color="#67E8F9" stop-opacity=".42"/>
      <stop offset="1" stop-color="#67E8F9" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="gold" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(290 460) rotate(90) scale(210 340)">
      <stop stop-color="#FFD166" stop-opacity=".38"/>
      <stop offset="1" stop-color="#FFD166" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="675" fill="url(#bg)"/>
  <rect width="1200" height="675" fill="url(#cyan)"/>
  <rect width="1200" height="675" fill="url(#gold)"/>

