<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Nova Clips cover art</title>
  <desc id="desc">A stylized short-video app cover with stacked phone screens and glowing playback panels.</desc>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08101c"/>
      <stop offset="45%" stop-color="#13243f"/>
      <stop offset="100%" stop-color="#28170f"/>
    </linearGradient>
    <linearGradient id="panelGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#72ecff"/>
      <stop offset="100%" stop-color="#ff9652"/>
    </linearGradient>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="1600" height="1000" fill="url(#bg)"/>
  <circle cx="240" cy="170" r="220" fill="#2aa9ff" opacity="0.18"/>
  <circle cx="1290" cy="148" r="240" fill="#ffaf68" opacity="0.16"/>
  <g transform="translate(310 180) rotate(-8 300 320)">
    <rect x="0" y="40" width="360" height="640" rx="38" fill="#09111f" opacity="0.78" stroke="#28486e" stroke-width="6"/>
    <rect x="30" y="110" width="300" height="500" rx="26" fill="#111b2d"/>
    <circle cx="180" cy="364" r="72" fill="#182742"/>
    <path d="M162 328l64 36-64 36z" fill="#eaf8ff"/>
  </g>
  <g transform="translate(690 120)">
    <rect x="0" y="0" width="420" height="760" rx="46" fill="#0a1526" stroke="url(#panelGlow)" stroke-width="8" filter="url(#softGlow)"/>
    <rect x="36" y="82" width="348" height="566" rx="30" fill="#101a2b"/>
    <rect x="36" y="82" width="348" height="180" rx="30" fill="#1b3151"/>
    <circle cx="210" cy="192" r="78" fill="#15263f"/>
    <path d="M186 152l78 40-78 40z" fill="#f7fbff"/>
    <rect x="64" y="298" width="292" height="18" rx="9" fill="#7be8ff" opacity="0.86"/>
    <rect x="64" y="340" width="248" height="18" rx="9" fill="#b1cbea" opacity="0.6"/>
    <rect x="64" y="392" width="292" height="112" rx="24" fill="#17253d"/>
    <rect x="64" y="532" width="292" height="70" rx="24" fill="#131f33"/>
    <g fill="#ffb362">
      <circle cx="108" cy="567" r="12"/>
      <circle cx="142" cy="567" r="12"/>
      <circle cx="176" cy="567" r="12"/>
    </g>
  </g>
  <g fill="#f6fbff" font-family="Oxanium, Arial, sans-serif">
    <text x="112" y="126" font-size="40" font-weight="700" letter-spacing="6">SHORT VIDEO APP</text>
    <text x="112" y="210" font-size="132" font-weight="800">NOVA CLIPS</text>
    <text x="118" y="268" font-size="34" font-weight="600" letter-spacing="4" opacity="0.86">UPLOAD. SCROLL. KEEP IT LIVE.</text>
  </g>
</svg>
