<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Spider Simulator cover art</title>
  <desc id="desc">A dramatic spider-themed game cover with web lines, city lights, and a giant spider silhouette above the skyline.</desc>
  <defs>
    <linearGradient id="sky" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050812"/>
      <stop offset="40%" stop-color="#11192e"/>
      <stop offset="100%" stop-color="#1c120d"/>
    </linearGradient>
    <linearGradient id="haze" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#59b8ff" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#ff9052" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="titleGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eff8ff"/>
      <stop offset="55%" stop-color="#91d4ff"/>
      <stop offset="100%" stop-color="#ffc084"/>
    </linearGradient>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1600" height="1000" fill="url(#sky)"/>
  <circle cx="260" cy="150" r="250" fill="#2d8cff" opacity="0.18"/>
  <circle cx="1330" cy="150" r="280" fill="#ff9b57" opacity="0.16"/>
  <ellipse cx="860" cy="440" rx="760" ry="330" fill="url(#haze)"/>

  <g stroke="#7dcfff" stroke-opacity="0.28" stroke-width="2" fill="none">
    <path d="M800 0v420"/>
