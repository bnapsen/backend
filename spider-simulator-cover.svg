  <g fill="#0b1220">
    <path d="M0 828L142 770L270 786L412 734L574 770L724 698L904 738L1072 678L1248 728L1432 664L1600 710V1000H0Z"/>
    <path d="M0 884L154 840L292 852L458 802L632 842L810 780L988 834L1162 780L1330 836L1488 784L1600 812V1000H0Z" fill="#121a2b"/>
