<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kalshi Weather Lab</title>
  <link rel="stylesheet" href="/kalshi-weather-lab.css">
</head>
<body>
  <header class="lab-topbar">
    <div>
      <a class="back-link" href="/">BNAPSN</a>
      <h1>Kalshi Weather Lab</h1>
      <p id="status">Ready</p>
    </div>
    <form id="scan-form" class="controls">
      <label>
        Date
        <input id="date" type="date">
      </label>
      <label>
        Min edge
        <input id="min-edge" type="number" min="-50" max="50" step="1" value="2">
      </label>
      <label>
        Max cost
        <input id="max-cost" type="number" min="0.10" max="25" step="0.10" value="3.00">
      </label>
      <label>
        Access
        <input id="access-token" type="password" autocomplete="off" placeholder="optional">
      </label>
      <label class="check">
        <input id="include-negative" type="checkbox">
        Show passes
      </label>
      <button type="submit">Scan</button>
    </form>
  </header>

  <main class="lab-shell">
    <section id="summary" class="summary-grid"></section>

    <section class="table-panel portfolio-panel">
      <div class="section-head">
        <div>
          <h2>Daily Portfolio</h2>
          <p class="subtext">Strict model basket. Positive EV is not guaranteed profit.</p>
        </div>
        <div class="panel-actions">
          <label class="compact-label">
            Bankroll
            <input id="portfolio-bankroll" class="compact-input bankroll-input" type="number" min="25" max="100000" step="25" value="1000">
          </label>
          <label class="compact-label">
            Kelly %
            <input id="portfolio-kelly-percent" class="compact-input percent-input" type="number" min="1" max="100" step="1" value="25">
          </label>
          <label class="compact-label">
            Budget
            <input id="portfolio-budget" class="compact-input money-input" type="number" min="1" max="250" step="1" value="25">
          </label>
          <label class="compact-label">
            Max/city
            <input id="portfolio-city-cap" class="compact-input money-input" type="number" min="1" max="50" step="1" value="5">
          </label>
          <button id="portfolio-build" type="button" class="ghost">Build</button>
          <button id="portfolio-audit" type="button" class="ghost">Audit basket</button>
        </div>
      </div>
      <div id="portfolio-summary" class="portfolio-summary"></div>
      <div class="table-wrap">
        <table class="portfolio-table">
          <thead>
            <tr>
              <th>Market</th>
              <th>Side</th>
              <th>Ask</th>
              <th>Model p</th>
              <th>Edge</th>
              <th>Kelly</th>
              <th>Contracts</th>
              <th>Cost</th>
              <th>Model EV</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="portfolio-items"></tbody>
        </table>
      </div>
    </section>

    <section class="table-panel">
      <div class="section-head">
        <h2>Candidate Markets</h2>
        <span id="count"></span>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Action</th>
              <th>Market</th>
              <th>Side</th>
              <th>Ask</th>
              <th>Adj prob</th>
              <th>Raw</th>
              <th>BE</th>
              <th>Edge</th>
              <th>EV</th>
              <th>Kelly</th>
              <th>Confidence</th>
              <th>Max</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="candidates"></tbody>
        </table>
      </div>
    </section>

    <section class="split">
      <section class="panel">
        <div class="section-head">
          <h2>Forecast Context</h2>
        </div>
        <div id="contexts" class="context-list"></div>
      </section>
      <section class="panel">
        <div class="section-head">
          <h2>Edge Audit</h2>
          <div class="panel-actions">
            <label class="check audit-toggle">
              <input id="auto-audit-enabled" type="checkbox">
              Auto audit top
            </label>
            <label class="compact-label">
              Top
              <input id="auto-audit-limit" class="compact-input" type="number" min="1" max="50" step="1" value="10">
            </label>
            <label class="compact-label">
              Every
              <input id="auto-audit-minutes" class="compact-input" type="number" min="3" max="120" step="1" value="15">
              min
            </label>
            <button id="audit-add-visible" type="button" class="ghost">Add buys</button>
            <button id="resolve-audit" type="button" class="ghost">Resolve</button>
            <button id="clear-ledger" type="button" class="ghost">Clear</button>
          </div>
        </div>
        <div id="audit-summary" class="audit-summary"></div>
        <div id="ledger" class="ledger-list"></div>
      </section>
    </section>
  </main>

  <dialog id="detail-dialog">
    <div class="dialog-head">
      <h2 id="detail-title">Market</h2>
      <button id="detail-close" type="button">Close</button>
    </div>
    <div id="detail-body"></div>
  </dialog>

  <script src="/kalshi-weather-lab.js"></script>
</body>
</html>
